<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instuif Bomen</title>

  <link rel="stylesheet" href="style.css"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <header class="header">
    <h1>🌳 Instuif Bomen</h1>
    <p>Steun Frederik, Evi, Sem & Jasper</p>
  </header>

  <main class="container">

    <!-- FORM -->
    <section class="card">
      <h2>Maak je schenking</h2>

      <input id="donorName" type="text" placeholder="Jouw naam" />

      <select id="treeSelect">
        <option value="Moseik">Moseik</option>
        <option value="Hazelaar">Hazelaar</option>
      </select>

      <input id="shares" type="number" min="1" value="1"/>

      <p class="amount">Totaal: <span id="amount">€25</span></p>

      <button id="giftBtn">Cadeaubon maken</button>
    </section>

    <!-- PROGRESS -->
    <section class="card">
      <h2>🌱 Boom voortgang</h2>

      <div class="tree">
        <h3>Moseik</h3>
        <div class="progress-bg">
          <div id="moseikBar" class="progress"></div>
        </div>
        <p id="moseikText"></p>
      </div>

      <div class="tree">
        <h3>Hazelaar</h3>
        <div class="progress-bg">
          <div id="hazelaarBar" class="progress"></div>
        </div>
        <p id="hazelaarText"></p>
      </div>

    </section>

    <!-- VOUCHER -->
    <section id="voucher" class="card hidden">
      <h2>🎟️ Jouw cadeaubon</h2>

      <div id="voucherContent"></div>

      <button id="downloadPdf">Download PDF</button>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
